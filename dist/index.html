    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap');
    :root{--ink:#eaf3ee;--muted:#a5b8b0;--forest:#061b19;--forest2:#0b2925;--panel:#102f2b;--line:#31564e;--gold:#f3bd4d;--coral:#ec6e57;--green:#68d391;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% -5%,#214d43 0,transparent 60%),var(--forest);color:var(--ink);font:16px/1.45 Outfit,system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:auto;padding:22px 22px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:1.28rem;line-height:1;font-weight:800;letter-spacing:.09em}.brand span{display:block;color:var(--gold);font:500 .7rem 'DM Mono';letter-spacing:.18em;margin-top:5px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.ghost{color:var(--muted);background:transparent;padding:8px 11px;border-radius:9px}.nav button.active,.nav button:hover,.ghost:hover{color:var(--ink);background:#173d36}.profile{display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--forest);font-weight:800}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:38px 0 25px}.eyebrow{color:var(--gold);font:500 .72rem 'DM Mono';letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(2.25rem,5vw,4.5rem);line-height:.95;letter-spacing:-.055em;margin:8px 0 0}.hero p{color:var(--muted);max-width:385px;margin:0}.episode-pill{color:var(--green);font:500 .72rem 'DM Mono';letter-spacing:.09em}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}.card,.scorecard{background:linear-gradient(145deg,#133630,#0c2724);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 50px #00000018}.leaderboard{padding:22px}.section-title{font-size:1.1rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.small{font:500 .72rem 'DM Mono';color:var(--muted);letter-spacing:.06em}.team-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:13px;padding:15px 0;border-top:1px solid #254940;transition:.2s}.team-row:first-of-type{border-top:0}.rank{font:700 1.35rem Outfit;color:var(--muted);text-align:center}.team-row:first-of-type .rank{color:var(--gold)}.team-main{min-width:0}.team-name{font-weight:700;font-size:1.05rem}.roster{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}.player{font-size:.79rem;color:var(--muted);cursor:pointer}.player:hover{color:var(--gold)}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px}.status-dot.out{background:var(--coral)}.points{text-align:right;font:700 1.3rem 'DM Mono';color:var(--gold)}.points small{display:block;font:500 .65rem 'DM Mono';color:var(--muted);letter-spacing:.1em}.side-stack{display:grid;gap:18px}.scorecard{padding:22px;background:linear-gradient(155deg,#17453b,#12332d)}.big-number{font:800 3.8rem/.9 Outfit;letter-spacing:-.06em;color:var(--gold);margin:9px 0}.trend{color:var(--green);font-size:.9rem}.timeline{padding:20px}.event-line{display:flex;gap:12px;padding:12px 0;border-top:1px solid #254940}.event-line:first-of-type{border:0}.event-point{font:700 .82rem 'DM Mono';color:var(--gold);margin-left:auto}.empty{padding:25px 0;color:var(--muted);text-align:center}.admin-wrap{display:grid;grid-template-columns:260px 1fr;gap:18px}.admin-side{padding:18px;height:max-content}.episode-list button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;color:var(--muted);background:transparent}.episode-list button.active{background:#21473e;color:#fff}.primary{background:var(--gold);color:#152720;border-radius:10px;padding:10px 14px;font-weight:800}.primary:hover{filter:brightness(1.08)}.danger{color:#ff9584;background:#48251f;border-radius:9px;padding:8px 10px}.admin-content{padding:24px}.admin-header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:23px}.admin-header h2{margin:3px 0 0;font-size:1.75rem}.contestant-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.contestant-btn{padding:12px;text-align:left;border-radius:12px;background:#173a33;color:#c7d8d1;border:1px solid #31564e}.contestant-btn.selected{background:#315c49;color:#fff;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.contestant-btn small{display:block;color:#9bb5aa;margin-top:4px}.event-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.event-btn{border:1px solid #31564e;background:#14332e;color:#e5f2ec;border-radius:11px;padding:12px;text-align:left;min-height:66px}.event-btn:hover{border-color:var(--gold);background:#1c4239}.event-btn b{display:block;color:var(--gold);font:600 .75rem 'DM Mono';margin-top:4px}.history{margin-top:27px}.history table{width:100%;border-collapse:collapse;font-size:.9rem}.history th,.history td{text-align:left;padding:10px 8px;border-bottom:1px solid #294b43}.history th{color:var(--muted);font:500 .7rem 'DM Mono';letter-spacing:.08em}.modal-back{position:fixed;inset:0;background:#01100dcc;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#102f2b;border:1px solid #497266;border-radius:22px;padding:26px;box-shadow:0 30px 80px #000}.modal h2{margin:4px 0 8px;font-size:1.8rem}.modal p{color:var(--muted);margin:0 0 18px}.modal label{display:block;color:#bed0c8;font-size:.85rem;margin:14px 0 5px}.modal input,.modal select{width:100%;padding:12px;background:#08201d;border:1px solid #31564e;border-radius:9px;color:#fff}.modal footer{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(440px,100%);padding:34px;background:linear-gradient(145deg,#123b34,#0b2522);border:1px solid #31564e;border-radius:26px;box-shadow:0 25px 90px #0008}.login-card h1{font-size:2.5rem;letter-spacing:-.06em;margin:10px 0}.login-card .brand{font-size:1rem}.login-card button{width:100%;margin-top:20px}.notice{background:#1a453b;color:#d5eee1;padding:10px 12px;border-radius:9px;margin-top:14px;font-size:.85rem}.page-head{padding:36px 0 22px}.page-head h1{margin:5px 0;font-size:2.4rem;letter-spacing:-.05em}.summary-list{display:grid;gap:13px}.summary-entry{padding:15px;border:1px solid #31564e;border-radius:13px;background:#102d28}.summary-entry h3{margin:0 0 6px}.summary-entry ul{margin:7px 0 0;padding-left:20px;color:var(--muted)}.summary-entry .total{color:var(--gold);font:600 .9rem 'DM Mono';float:right}.team-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:25px}.team-total{padding:18px;border-radius:14px;background:#173c35;border:1px solid #31564e}.team-total b{display:block;color:var(--gold);font:700 1.5rem 'DM Mono';margin-top:6px}.profile-card{padding:25px;max-width:750px}.profile-card h1{margin:0;font-size:2.4rem}.profile-score{font:800 3rem Outfit;color:var(--gold);margin:16px 0}.breakdown{margin-top:20px}.breakdown details{border-top:1px solid #31564e;padding:12px 0}.breakdown summary{cursor:pointer;font-weight:600}.settings{max-width:620px;padding:25px}.settings h2{margin-top:0}.settings label{display:block;margin-top:16px;color:var(--muted)}.settings input{width:100%;margin-top:5px;background:#08201d;border:1px solid #31564e;color:white;padding:11px;border-radius:8px}.toast{position:fixed;bottom:22px;right:22px;background:#edf8ef;color:#123525;padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 30px #0006;z-index:20}.hidden{display:none!important}@media(max-width:780px){.shell{padding:16px 15px 45px}.topbar{align-items:flex-start}.profile .name{display:none}.hero{padding:28px 0 22px;display:block}.hero p{margin-top:18px}.grid,.admin-wrap{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.admin-side{display:flex;gap:8px;overflow:auto}.admin-side .episode-list{display:flex;gap:7px}.admin-side h3,.admin-side .primary{display:none}.contestant-picker{grid-template-columns:repeat(2,1fr)}.event-grid{grid-template-columns:repeat(2,1fr)}.team-totals{grid-template-columns:repeat(2,1fr)}.nav{gap:1px}.nav button{padding:7px}.topbar{flex-wrap:wrap}.nav{order:3;width:100%}}@media(max-width:460px){.side-stack{grid-template-columns:1fr}.team-row{grid-template-columns:36px 1fr auto;gap:7px}.points{font-size:1rem}.roster{gap:6px}.history{overflow:auto}.hero h1{font-size:2.65rem}}

    :root{--ink:#f3fbff;--muted:#afc9dc;--forest:#031a33;--forest2:#05274a;--panel:#0a315c;--line:#28648a;--gold:#65e1e8;--coral:#ff9166;--green:#64d8ff}
    body{background:radial-gradient(900px 520px at 88% -4%,#0c6292 0,transparent 58%),radial-gradient(620px 440px at 0 100%,#073e71 0,transparent 70%),linear-gradient(135deg,#021226,#031a33 62%,#06274d)}
    .nav button.active,.nav button:hover,.ghost:hover{background:#0b426f}.card,.scorecard{background:linear-gradient(145deg,#093866,#051f45);border-color:var(--line)}.scorecard{background:linear-gradient(155deg,#0b5680,#073260)}
    .team-row,.event-line{border-color:#205a82}.episode-list button.active{background:#0a5783}.primary{color:#03203e;background:linear-gradient(135deg,#80edf0,#39cbd6);box-shadow:0 8px 20px #40d8e325}.contestant-btn{background:#093865;color:#eaf7ff;border-color:#28648a}.contestant-btn.selected{background:#0b5783}.contestant-btn small{color:#b6d8e8}.event-btn{background:#082f59;color:#edfaff;border-color:#28648a}.event-btn:hover{background:#0b4a78}.history th,.history td{border-color:#205a82}.modal{background:#082c55;border-color:#3d8cb2}.modal-back{background:#010a16e6}.modal input,.modal select,.settings input{background:#031b38;border-color:#28648a}.login-card{background:linear-gradient(145deg,#0a4773,#031a38);border-color:#28648a}.notice{background:#0a4773;color:#e2f7ff}.summary-entry{background:#082e57;border-color:#28648a}.team-total{background:#093d69;border-color:#28648a}.danger{background:#5a2e36;color:#ffd0c3}.toast{background:#e7fbff;color:#073564}.status-dot{box-shadow:0 0 9px #64d8ff}.status-dot.out{box-shadow:none}.trend{color:#65e1e8}

<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const BASE={teams:[{id:'jayz',name:'JayZ',password:null,priorRank:null},{id:'josh',name:'Josh',password:null,priorRank:null},{id:'biebelbogen',name:'Biebelbogen',password:null,priorRank:null},{id:'nb',name:'NB',password:null,priorRank:null}],contestants:[['carter','Carter','jayz'],['linnea','Linnea','jayz'],['patt','Patt','jayz'],['devin','Devin','jayz'],['lewis','Lewis','josh'],['kristen','Kristen','josh'],['ori','Ori','josh'],['rob','Rob','josh'],['mike','Mike','biebelbogen'],['jelly','Jelly','biebelbogen'],['kliby','Kliby','biebelbogen'],['maggie','Maggie','biebelbogen'],['sharonda','Sharonda','nb'],['brady','Brady','nb'],['jenna','Jenna','nb'],['alexis','Alexis','nb']].map(([id,name,teamId])=>({id,name,teamId,status:'active',eliminatedEpisode:null,merge:false,finalist:false,winner:false})),episodes:[1,2,3,4,5,6,7,8],events:[]};
let db=JSON.parse(localStorage.getItem('fs-db')||'null')||structuredClone(BASE), session=localStorage.getItem('fs-session')||null, page='home', activeEpisode=3, selected=[];
const SEASON_EPISODES=Array.from({length:11},(_,i)=>i+3);db.episodes=SEASON_EPISODES;
const RULES={survived:{label:'Survived Episode',pts:1},teamReward:{label:'Team Reward Win',pts:1},teamImmunity:{label:'Team Immunity Win',pts:2},merge:{label:'Made the Merge',pts:3,once:'merge'},finalist:{label:'Final Tribal Council',pts:5,once:'finalist'},winner:{label:'Won the Season',pts:8,once:'winner'},reward:{label:'Individual Reward Win',pts:1},immunity:{label:'Individual Immunity Win',pts:2},idolFound:{label:'Found Hidden Idol',pts:1},idolPlay:{label:'Successful Idol Play',pts:3},advantage:{label:'Successful Advantage',pts:2},correctVote:{label:'Correct Elimination Vote',pts:1},zeroVotes:{label:'Zero Elimination Votes',pts:1},lostVote:{label:'Lost Vote',pts:-1},coinWin:{label:'MrBeast Coin Flip Win',pts:4},coinLoss:{label:'Coin Flip Loss / Eliminated',pts:-2},cry:{label:'Cried',pts:-1,uniqueEpisode:true}};
function save(){localStorage.setItem('fs-db',JSON.stringify(db));localStorage.setItem('fs-session',session||'')}
function team(id){return db.teams.find(x=>x.id===id)}function person(id){return db.contestants.find(x=>x.id===id)}function eventsFor(id){return db.events.filter(e=>e.contestantId===id)}function score(id){return eventsFor(id).reduce((s,e)=>s+e.points,0)}function roster(tid){return db.contestants.filter(x=>x.teamId===tid)}
function standings(){return db.teams.map(t=>({...t,total:roster(t.id).reduce((s,p)=>s+score(p.id),0)})).sort((a,b)=>b.total-a.total).map((t,i)=>({...t,rank:i+1}))}function current(){return team(session)}function isAdmin(){return session==='jayz'}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(m){let e=document.querySelector('#toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function loginView(){return `<main class="login"><section class="login-card"><div class="brand">FANTASY SURVIVOR<span>PRIVATE LEAGUE • SEASON 1</span></div><h1>Outscore. Outlast.</h1><p>Sign in to follow your tribe, track the season, and make every Tribal Council count.</p><form id="login-form"><label>Team name</label><select id="login-team">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><label>${db.teams.some(t=>t.password)?'Password or league key':'League key'}</label><input id="login-secret" type="password" autocomplete="current-password" placeholder="Enter 1234 to begin" required><button class="primary" type="submit">Enter the Island</button></form><div class="notice">First time? Choose your team and enter the league key <b>1234</b>.</div></section></main>`}
function nav(){let t=current();return `<header class="topbar"><div class="brand">FANTASY SURVIVOR<span>PRIVATE LEAGUE • SEASON 1</span></div><nav class="nav"><button data-page="home" class="${page==='home'?'active':''}">Leaderboard</button><button data-page="episodes" class="${page==='episodes'?'active':''}">Episodes</button>${isAdmin()?`<button data-page="admin" class="${page==='admin'?'active':''}">Admin</button>`:''}<button data-page="settings" class="${page==='settings'?'active':''}">Settings</button></nav><div class="profile"><div class="name">${esc(t.name)}</div><div class="avatar">${esc(t.name[0])}</div><button class="ghost" id="logout">Log out</button></div></header>`}
function rankMove(t){if(t.priorRank==null)return '<span class="small">—</span>';let d=t.priorRank-t.rank;return d>0?`<span class="trend">↑ ${d}</span>`:d<0?`<span style="color:var(--coral)">↓ ${-d}</span>`:'<span class="small">—</span>'}
function home(){let rows=standings();let leader=rows[0];return `<div class="shell">${nav()}<section class="hero"><div><div class="eyebrow">The tribe has spoken</div><h1>Season<br>Leaderboard</h1></div><p>Scores update instantly from official episode events. Every vote, win, and tear can change the game.</p></section><main class="grid"><section class="leaderboard card"><div class="section-title">League standings <span class="small">LIVE TOTALS</span></div>${rows.map(t=>`<article class="team-row"><div class="rank">${t.rank===1?'♛':t.rank}</div><div class="team-main"><div class="team-name">${esc(t.name)} ${rankMove(t)}</div><div class="roster">${roster(t.id).map(p=>`<span class="player" data-contestant="${p.id}"><i class="status-dot ${p.status==='eliminated'?'out':''}"></i>${esc(p.name)} <b>${score(p.id)}</b></span>`).join('')}</div></div><div class="points">${t.total}<small>PTS</small></div></article>`).join('')}</section><aside class="side-stack"><section class="scorecard"><div class="eyebrow">Current leader</div><div class="big-number">${leader.total}</div><b>${esc(leader.name)}</b><div class="trend">● holding first place</div></section><section class="timeline card"><div class="section-title">Recent activity <span class="small">${db.events.length} EVENTS</span></div>${db.events.slice(-4).reverse().map(e=>`<div class="event-line"><span>Ep. ${e.episode}</span><div><b>${esc(person(e.contestantId).name)}</b><br><span class="small">${esc(e.label)}</span></div><span class="event-point">${e.points>0?'+':''}${e.points}</span></div>`).join('')||'<div class="empty">No points on the board yet.<br>Let the season begin.</div>'}</section></aside></main></div>`}
function episodes(){return `<div class="shell">${nav()}<section class="page-head"><div class="eyebrow">Season record</div><h1>Episode recaps</h1><p class="small">Select an episode to see every scoring moment.</p></section><div class="grid"><section class="card leaderboard">${db.episodes.map(n=>`<button class="episode-card ghost" style="display:flex;width:100%;justify-content:space-between;border-bottom:1px solid #31564e;border-radius:0;padding:15px 4px" data-episode="${n}"><b>Episode ${n}</b><span>${db.events.filter(e=>e.episode===n).length} events</span></button>`).join('')}</section><aside class="scorecard"><div class="eyebrow">Score rule</div><h2>Totals are calculated, never typed.</h2><p>Every event stays attached to an episode, contestant, and official point value.</p></aside></div></div>`}
function recap(n){let es=db.events.filter(e=>e.episode===n), people=[...new Set(es.map(e=>e.contestantId))].map(person);return `<div class="shell">${nav()}<section class="page-head"><button class="ghost" data-page="episodes">← Episodes</button><div class="eyebrow">Episode ${n}</div><h1>Tribal recap</h1></section><section class="summary-list">${people.length?people.map(p=>{let x=es.filter(e=>e.contestantId===p.id),total=x.reduce((a,e)=>a+e.points,0);return `<article class="summary-entry"><span class="total">${total>0?'+':''}${total}</span><h3>${esc(p.name)}</h3><ul>${x.map(e=>`<li>${esc(e.label)} <b>${e.points>0?'+':''}${e.points}</b></li>`).join('')}</ul></article>`}).join(''):'<div class="card empty">No scoring events yet for Episode '+n+'.</div>'}</section><div class="team-totals">${db.teams.map(t=>{let total=es.filter(e=>person(e.contestantId).teamId===t.id).reduce((a,e)=>a+e.points,0);return `<div class="team-total"><span class="small">${esc(t.name)}</span><b>${total>0?'+':''}${total}</b></div>`}).join('')}</div></div>`}
function admin(){let available=db.contestants.filter(p=>p.status==='active'); return `<div class="shell">${nav()}<div class="admin-wrap" style="margin-top:28px"><aside class="card admin-side"><h3 style="margin-top:0">Episodes</h3><div class="episode-list">${db.episodes.map(n=>`<button data-admin-episode="${n}" class="${activeEpisode===n?'active':''}">Episode ${n}</button>`).join('')}</div><button class="primary" id="new-episode" style="margin-top:14px;width:100%">+ Add episode</button></aside><main class="card admin-content"><div class="admin-header"><div><div class="eyebrow">Score episode</div><h2>Episode ${activeEpisode}</h2></div><button class="ghost" id="clear-select">Clear selection</button></div><div class="small">SELECT ACTIVE CONTESTANTS — ${selected.length} SELECTED</div><section class="contestant-picker">${available.map(p=>`<button class="contestant-btn ${selected.includes(p.id)?'selected':''}" data-pick="${p.id}">${esc(p.name)}<small>${esc(team(p.teamId).name)} · ${score(p.id)} pts</small></button>`).join('')}</section><div style="display:flex;gap:9px;margin-top:13px"><button class="danger" id="mark-out">Mark selected eliminated</button><button class="ghost" id="restore-player">Restore eliminated contestant</button></div><div class="small" style="margin-top:24px">APPLY OFFICIAL EVENT</div><section class="event-grid">${Object.entries(RULES).map(([key,r])=>`<button class="event-btn" data-rule="${key}">${r.label}<b>${r.pts>0?'+':''}${r.pts} PTS</b></button>`).join('')}</section><section class="history"><div class="section-title">Episode history <span class="small">UNDO OR CORRECT</span></div><table><thead><tr><th>CONTESTANT</th><th>EVENT</th><th>POINTS</th><th></th></tr></thead><tbody>${db.events.filter(e=>e.episode===activeEpisode).slice().reverse().map(e=>`<tr><td>${esc(person(e.contestantId).name)}</td><td>${esc(e.label)}</td><td style="color:${e.points<0?'#ec6e57':'#f3bd4d'}">${e.points>0?'+':''}${e.points}</td><td><button class="danger" data-delete="${e.id}">Undo</button></td></tr>`).join('')||'<tr><td colspan="4" class="small">No events recorded for this episode.</td></tr>'}</tbody></table></section></main></div></div>`}
function settings(){let t=current();return `<div class="shell">${nav()}<section class="page-head"><div class="eyebrow">Your camp</div><h1>Settings</h1></section><section class="card settings"><h2>Team account</h2><p>Changing your display name never changes your original roster or account ID.</p><form id="settings-form"><label>Fantasy team name<input name="name" value="${esc(t.name)}" required></label><label>New password <input name="password" type="password" placeholder="Leave blank to keep current password"></label><button class="primary" type="submit" style="margin-top:20px">Save changes</button></form><div class="breakdown"><h3>Your roster</h3>${roster(t.id).map(p=>`<div class="event-line"><b>${esc(p.name)}</b><span class="small">${p.status==='active'?'● Active':'● Eliminated — Episode '+p.eliminatedEpisode}</span><span class="event-point">${score(p.id)} pts</span></div>`).join('')}</div></section></div>`}
function profile(id){let p=person(id), own=team(p.teamId), grouped=Object.groupBy(eventsFor(id),e=>e.episode);return `<div class="shell">${nav()}<section class="page-head"><button class="ghost" data-page="home">← Leaderboard</button></section><section class="card profile-card"><div class="eyebrow">Fantasy owner · ${esc(own.name)}</div><h1>${esc(p.name)}</h1><div class="small" style="margin-top:7px;color:${p.status==='active'?'var(--green)':'var(--coral)'}">${p.status==='active'?'● ACTIVE':'● ELIMINATED — EPISODE '+p.eliminatedEpisode}</div><div class="profile-score">${score(id)} <span class="small">TOTAL FANTASY POINTS</span></div><div class="breakdown"><h3>Scoring breakdown</h3>${Object.keys(grouped).length?Object.entries(grouped).sort((a,b)=>a[0]-b[0]).map(([ep,items])=>`<details><summary>Episode ${ep} <span style="float:right;color:var(--gold)">${items.reduce((a,e)=>a+e.points,0)>0?'+':''}${items.reduce((a,e)=>a+e.points,0)}</span></summary><ul>${items.map(e=>`<li>${esc(e.label)} ${e.points>0?'+':''}${e.points}</li>`).join('')}</ul></details>`).join(''):'<p class="small">No scoring events yet.</p>'}</div></section></div>`}
function setupModal(t){return `<div class="modal-back"><section class="modal"><div class="eyebrow">First login</div><h2>Claim your tribe</h2><p>Create a password for future sign-ins. You can personalize your team name now or anytime in Settings.</p><form id="setup-form"><label>Team name<input name="name" value="${esc(t.name)}" required></label><label>Create password<input name="password" type="password" minlength="4" required></label><footer><button class="primary">Complete setup</button></footer></form></section></div>`}
function render(){if(!session){app.innerHTML=loginView();bind();return}let v=page==='home'?home():page==='episodes'?episodes():page==='admin'?admin():page==='settings'?settings():page.startsWith('recap:')?recap(+page.split(':')[1]):page.startsWith('profile:')?profile(page.split(':')[1]):home();app.innerHTML=v+(current().password?'' :setupModal(current()));bind()}
function addEvent(rule){if(!selected.length)return toast('Select at least one contestant.');let r=RULES[rule], valid=selected.filter(id=>{if(r.uniqueEpisode&&db.events.some(e=>e.episode===activeEpisode&&e.contestantId===id&&e.rule===rule)){toast('Cry is limited to once per contestant per episode.');return false}if(r.once&&person(id)[r.once]){toast(person(id).name+' already has that milestone.');return false}return true});valid.forEach(id=>{db.events.push({id:crypto.randomUUID(),episode:activeEpisode,contestantId:id,rule,label:r.label,points:r.pts});if(r.once)person(id)[r.once]=true;if(rule==='coinLoss'){let p=person(id);p.status='eliminated';p.eliminatedEpisode=activeEpisode}});if(valid.length){selected=[];save();toast(`${valid.length} event${valid.length>1?'s':''} applied`);render()}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-contestant]').forEach(b=>b.onclick=()=>{page='profile:'+b.dataset.contestant;render()});document.querySelectorAll('[data-episode]').forEach(b=>b.onclick=()=>{page='recap:'+b.dataset.episode;render()});document.querySelector('#logout')?.addEventListener('click',()=>{session=null;save();render()});document.querySelector('#login-form')?.addEventListener('submit',e=>{e.preventDefault();let id=document.querySelector('#login-team').value,sec=document.querySelector('#login-secret').value,t=team(id);if((!t.password&&sec==='1234')||(t.password&&sec===t.password)){session=id;save();render()}else toast('That team name and password do not match.')});document.querySelector('#setup-form')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),t=current();t.name=f.get('name').trim();t.password=f.get('password');save();render();toast('Your team is ready.')});document.querySelector('#settings-form')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),t=current();t.name=f.get('name').trim();if(f.get('password'))t.password=f.get('password');save();render();toast('Settings saved.')});document.querySelectorAll('[data-admin-episode]').forEach(b=>b.onclick=()=>{activeEpisode=+b.dataset.adminEpisode;selected=[];render()});document.querySelector('#new-episode')?.addEventListener('click',()=>{db.episodes.push(Math.max(...db.episodes)+1);activeEpisode=Math.max(...db.episodes);save();render()});document.querySelector('#clear-select')?.addEventListener('click',()=>{selected=[];render()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let id=b.dataset.pick;selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render()});document.querySelector('#mark-out')?.addEventListener('click',()=>{if(!selected.length)return toast('Select a contestant first.');selected.forEach(id=>{let p=person(id);p.status='eliminated';p.eliminatedEpisode=activeEpisode});selected=[];save();render();toast('Contestant status updated.')});document.querySelector('#restore-player')?.addEventListener('click',()=>{let p=db.contestants.find(x=>x.status==='eliminated');if(!p)return toast('No eliminated contestant to restore.');p.status='active';p.eliminatedEpisode=null;save();render();toast(p.name+' restored to active.')});document.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>addEvent(b.dataset.rule));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let e=db.events.find(x=>x.id===b.dataset.delete);let r=RULES[e.rule];if(r.once)person(e.contestantId)[r.once]=db.events.some(x=>x.id!==e.id&&x.contestantId===e.contestantId&&x.rule===e.rule);if(e.rule==='coinLoss'){let p=person(e.contestantId);p.status='active';p.eliminatedEpisode=null}db.events=db.events.filter(x=>x.id!==e.id);save();render();toast('Event removed — totals updated.')})}
const whale=`<svg class="whale-mark" viewBox="0 0 64 64" aria-hidden="true"><path fill="#65e1e8" d="M7 35c2-13 13-21 28-21 7 0 13 2 17 6 1-5 5-8 10-9-1 7-2 11-7 14 4 2 6 6 7 11-5-2-9-4-11-8-6 9-18 16-31 16-7 0-11-3-13-9Z"/><path fill="#ff9166" d="M25 20c-2-7 1-12 6-15 1 7 4 10 9 13-6 1-10 2-15 2Z"/><circle cx="42" cy="24" r="1.7" fill="#031a33"/><path d="M15 37c8 4 18 4 27-1" fill="none" stroke="#f3fbff" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const originalRender=render;render=()=>{originalRender();document.querySelectorAll('.brand').forEach(el=>{if(!el.querySelector('.whale-mark'))el.insertAdjacentHTML('afterbegin',whale)});document.querySelectorAll('.brand span').forEach(el=>el.textContent='PRIVATE LEAGUE • SEASON 51');if(Math.max(...db.episodes)>=13)document.querySelector('#new-episode')?.classList.add('hidden')};
render();
</script><script src="/app.js"></script></body></html>
